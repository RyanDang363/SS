[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-rag"
version = "0.0.1"
description = "RAGGERS — toy video RAG demo (Stage 0-lite: shared data contracts)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "opencv-python-headless>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
transcribe = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]
embed = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]
ocr = [
    "easyocr>=1.7",
]

[project.scripts]
raggers-validate = "video_rag.validate:main"
raggers-sample-frames = "video_rag.index.sample_frames:main"
raggers-transcribe = "video_rag.index.transcribe_audio:main"
raggers-embed = "video_rag.index.embed_chunks:main"
raggers-index = "video_rag.index.run_pipeline:main"

[tool.setuptools.packages.find]
include = ["video_rag*"]
exclude = ["tests*", "data*", "docs*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
